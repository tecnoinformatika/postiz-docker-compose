services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: always
    environment:
      # === Required Settings
      MAIN_URL: '${MAIN_URL}'
      FRONTEND_URL: '${FRONTEND_URL}'
      NEXT_PUBLIC_BACKEND_URL: '${NEXT_PUBLIC_BACKEND_URL}'
      JWT_SECRET: '${JWT_SECRET}'
      DATABASE_URL: '${POSTGRES_URL}'
      REDIS_URL: '${REDIS_URL}'
      BACKEND_INTERNAL_URL: '${BACKEND_INTERNAL_URL}'
      TEMPORAL_ADDRESS: "temporal:7233"
      IS_GENERAL: '${IS_GENERAL}'
      DISABLE_REGISTRATION: '${DISABLE_REGISTRATION}'
      RUN_CRON: '${RUN_CRON}'

      # === Storage Settings
      STORAGE_PROVIDER: '${STORAGE_PROVIDER}'
      UPLOAD_DIRECTORY: '${UPLOAD_DIRECTORY}'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '${NEXT_PUBLIC_UPLOAD_DIRECTORY}'

      # === Cloudflare (R2) Settings
      # STORAGE_PROVIDER: 'cloudflare'
      CLOUDFLARE_ACCOUNT_ID: '${CLOUDFLARE_ACCOUNT_ID}'
      CLOUDFLARE_ACCESS_KEY: '${CLOUDFLARE_ACCESS_KEY}'
      CLOUDFLARE_SECRET_ACCESS_KEY: '${CLOUDFLARE_SECRET_ACCESS_KEY}'
      CLOUDFLARE_BUCKETNAME: '${CLOUDFLARE_BUCKETNAME}'
      CLOUDFLARE_BUCKET_URL: '${CLOUDFLARE_BUCKET_URL}'
      CLOUDFLARE_REGION: '${CLOUDFLARE_REGION}'

      # === Social Media API Settings
      X_API_KEY: '${X_API_KEY}'
      X_API_SECRET: '${X_API_SECRET}'
      LINKEDIN_CLIENT_ID: '${LINKEDIN_CLIENT_ID}'
      LINKEDIN_CLIENT_SECRET: '${LINKEDIN_CLIENT_SECRET}'
      REDDIT_CLIENT_ID: '${REDDIT_CLIENT_ID}'
      REDDIT_CLIENT_SECRET: '${REDDIT_CLIENT_SECRET}'
      GITHUB_CLIENT_ID: '${GITHUB_CLIENT_ID}'
      GITHUB_CLIENT_SECRET: '${GITHUB_CLIENT_SECRET}'
      BEEHIIVE_API_KEY: '${BEEHIIVE_API_KEY}'
      BEEHIIVE_PUBLICATION_ID: '${BEEHIIVE_PUBLICATION_ID}'
      THREADS_APP_ID: '${THREADS_APP_ID}'
      THREADS_APP_SECRET: '${THREADS_APP_SECRET}'
      FACEBOOK_APP_ID: '${FACEBOOK_APP_ID}'
      FACEBOOK_APP_SECRET: '${FACEBOOK_APP_SECRET}'
      YOUTUBE_CLIENT_ID: '${YOUTUBE_CLIENT_ID}'
      YOUTUBE_CLIENT_SECRET: '${YOUTUBE_CLIENT_SECRET}'
      TIKTOK_CLIENT_ID: '${TIKTOK_CLIENT_ID}'
      TIKTOK_CLIENT_SECRET: '${TIKTOK_CLIENT_SECRET}'
      PINTEREST_CLIENT_ID: '${PINTEREST_CLIENT_ID}'
      PINTEREST_CLIENT_SECRET: '${PINTEREST_CLIENT_SECRET}'
      DRIBBBLE_CLIENT_ID: '${DRIBBBLE_CLIENT_ID}'
      DRIBBBLE_CLIENT_SECRET: '${DRIBBBLE_CLIENT_SECRET}'
      DISCORD_CLIENT_ID: '${DISCORD_CLIENT_ID}'
      DISCORD_CLIENT_SECRET: '${DISCORD_CLIENT_SECRET}'
      DISCORD_BOT_TOKEN_ID: '${DISCORD_BOT_TOKEN_ID}'
      SLACK_ID: '${SLACK_ID}'
      SLACK_SECRET: '${SLACK_SECRET}'
      SLACK_SIGNING_SECRET: '${SLACK_SIGNING_SECRET}'
      MASTODON_URL: '${MASTODON_URL}'
      MASTODON_CLIENT_ID: '${MASTODON_CLIENT_ID}'
      MASTODON_CLIENT_SECRET: '${MASTODON_CLIENT_SECRET}'

      # === OAuth & Authentik Settings
      NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME: '${NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME}'
      NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL: '${NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL}'
      POSTIZ_GENERIC_OAUTH: '${POSTIZ_GENERIC_OAUTH}'
      POSTIZ_OAUTH_URL: '${POSTIZ_OAUTH_URL}'
      POSTIZ_OAUTH_AUTH_URL: '${POSTIZ_OAUTH_AUTH_URL}'
      POSTIZ_OAUTH_TOKEN_URL: '${POSTIZ_OAUTH_TOKEN_URL}'
      POSTIZ_OAUTH_USERINFO_URL: '${POSTIZ_OAUTH_USERINFO_URL}'
      POSTIZ_OAUTH_CLIENT_ID: '${POSTIZ_OAUTH_CLIENT_ID}'
      POSTIZ_OAUTH_CLIENT_SECRET: '${POSTIZ_OAUTH_CLIENT_SECRET}'
      POSTIZ_OAUTH_SCOPE: '${POSTIZ_OAUTH_SCOPE}'

      # === Sentry
      NEXT_PUBLIC_SENTRY_DSN: '${NEXT_PUBLIC_SENTRY_DSN}'
      SENTRY_SPOTLIGHT: '${SENTRY_SPOTLIGHT}'

      # === Misc Settings
      OPENAI_API_KEY: '${OPENAI_API_KEY}'
      NEXT_PUBLIC_DISCORD_SUPPORT: '${NEXT_PUBLIC_DISCORD_SUPPORT}'
      NEXT_PUBLIC_POLOTNO: '${NEXT_PUBLIC_POLOTNO}'
      API_LIMIT: '${API_LIMIT}'

      # === Payment / Stripe Settings
      FEE_AMOUNT: '${FEE_AMOUNT}'
      STRIPE_PUBLISHABLE_KEY: '${STRIPE_PUBLISHABLE_KEY}'
      STRIPE_SECRET_KEY: '${STRIPE_SECRET_KEY}'
      STRIPE_SIGNING_KEY: '${STRIPE_SIGNING_KEY}'
      STRIPE_SIGNING_KEY_CONNECT: '${STRIPE_SIGNING_KEY_CONNECT}'

      # === Developer Settings
      NX_ADD_PLUGINS: '${NX_ADD_PLUGINS}'

      # === Short Link Service Settings (Optional - leave blank if unused)
      DUB_TOKEN: '${DUB_TOKEN}'
      DUB_API_ENDPOINT: '${DUB_API_ENDPOINT}'
      DUB_SHORT_LINK_DOMAIN: '${DUB_SHORT_LINK_DOMAIN}'
      SHORT_IO_SECRET_KEY: '${SHORT_IO_SECRET_KEY}'
      KUTT_API_KEY: '${KUTT_API_KEY}'
      KUTT_API_ENDPOINT: '${KUTT_API_ENDPOINT}'
      KUTT_SHORT_LINK_DOMAIN: '${KUTT_SHORT_LINK_DOMAIN}'
      LINK_DRIP_API_KEY: '${LINK_DRIP_API_KEY}'
      LINK_DRIP_API_ENDPOINT: '${LINK_DRIP_API_ENDPOINT}'
      LINK_DRIP_SHORT_LINK_DOMAIN: '${LINK_DRIP_SHORT_LINK_DOMAIN}'

    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - "4007:5000"
    networks:
      - temps-app-network
      - postiz-network
      - temporal-network
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      temporal:
        condition: service_healthy

  # NOTA: Postiz usa el Postgres externo administrado por temps
  # (recurso "postgres-poztiz", vía POSTGRES_URL) y el Redis externo
  # (recurso "redis-poztiz", vía REDIS_URL). Ya no se levantan
  # contenedores propios de Postgres/Redis para Postiz.

  # For Application Monitoring / Debugging
  spotlight:
    profiles: [debug]
    pull_policy: always
    container_name: spotlight
    restart: unless-stopped
    ports:
      - 127.0.0.1:8969:8969/tcp
    image: ghcr.io/getsentry/spotlight:latest
    networks:
      - postiz-network

  # -----------------------
  # Temporal Stack
  # -----------------------
  # NOTA: Elasticsearch fue removido del stack porque la plataforma de deploy
  # (temps) bloquea `cap_add`, y sin CAP_SYS_CHROOT el contenedor de ES no
  # puede arrancar (chroot: Operation not permitted). Temporal funciona sin
  # ES usando el dynamic config "development-sql.yaml" (visibilidad via
  # Postgres); solo se pierde la búsqueda avanzada de workflows en su UI,
  # que Postiz no requiere para operar.
  #
  # Temporal también usa el Postgres externo "postgres-poztiz" (mismo
  # servidor que Postiz, bases de datos separadas: "temporal" y
  # "temporal_visibility", creadas automáticamente por el propio
  # temporalio/auto-setup si el usuario tiene permiso CREATEDB). Ya no se
  # levanta un contenedor temporal-postgresql propio.
  temporal:
    container_name: temporal
    restart: always
    ports:
      - '127.0.0.1:7233:7233'
    image: temporalio/auto-setup:1.28.1
    environment:
      - DB=postgres12
      - DB_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=${POSTGRES_HOST}
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=false
      - TEMPORAL_NAMESPACE=default
    networks:
      - temps-app-network
      - temporal-network
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    restart: on-failure
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      temporal:
        condition: service_healthy
    tty: true

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    restart: always
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  postiz-config:
    external: false

  postiz-uploads:
    external: false

networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
  # Red compartida creada por la plataforma temps; ahí viven los recursos
  # administrados (postgres-poztiz, redis-poztiz, etc.). No la creamos
  # nosotros, solo nos conectamos.
  temps-app-network:
    external: true
    name: temps-app-network
